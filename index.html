<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Linux Terminal</title>
    <!-- Use the main v86 release script directly -->
    <script src="https://copy.sh/v86/build/v86_all.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            margin: 0;
            padding: 20px;
        }
        #screen {
            width: 100%;
            height: 80vh;
            background-color: #111;
            border: 1px solid #333;
            font-size: 14px;
            white-space: pre;
            overflow: auto;
        }
    </style>
</head>
<body>

    <h2>Linux VM Terminal</h2>
    <div id="screen"></div>

    <script>
        window.onload = function() {
            var emulator = new V86Starter({
                wasm_path: "https://copy.sh/v86/build/v86.wasm",
                memory_size: 128 * 1024 * 1024,
                vga_memory_size: 2 * 1024 * 1024,
                
                // Mount container
                screen_container: document.getElementById("screen"),

                // Core BIOS and image paths from copy.sh directly
                bios: { url: "https://copy.sh/v86/bios/seabios.bin" },
                vga_bios: { url: "https://copy.sh/v86/bios/vgabios.bin" },
                cdrom: { url: "https://copy.sh/v86/images/linux4.iso" },
                
                autostart: true,
            });
        };
    </script>
</body>
</html>
