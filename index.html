<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Linux Terminal</title>
    <!-- Load the v86 emulator library -->
    <script src="https://cdn.jsdelivr.net/npm/v86@0.9.0/build/libv86.js"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: monospace;
            margin: 0;
            padding: 20px;
        }
        #terminal {
            width: 100%;
            height: 80vh;
            background-color: #111;
            border: 1px solid #333;
            font-size: 14px;
            white-space: pre-wrap;
            overflow: auto;
        }
    </style>
</head>
<body>

    <h2>Linux VM in Chrome OS</h2>
    <div id="terminal"></div>

    <script>
        window.onload = function() {
            // Initialize the v86 emulator
            var emulator = new V86Starter({
                wasm_path: "https://cdn.jsdelivr.net/npm/v86@0.9.0/build/v86.wasm",
                memory_size: 512 * 1024 * 1024,
                vga_memory_size: 8 * 1024 * 1024,
                
                // Mount the HTML element to display the terminal
                screen_container: document.getElementById("terminal"),

                // Load a minimal Linux image (Buildroot)
                bios: {
                    url: "https://cdn.jsdelivr.net/npm/v86@0.9.0/bios/seabios.bin",
                },
                vga_bios: {
                    url: "https://cdn.jsdelivr.net/npm/v86@0.9.0/bios/vgabios.bin",
                },
                bzimage: {
                    url: "https://cdn.jsdelivr.net/npm/v86-linux-image@1.0.0/bzImage",
                },
                initrd: {
                    url: "https://cdn.jsdelivr.net/npm/v86-linux-image@1.0.0/rootfs.cpio.gz",
                },
                autostart: true,
            });

            console.log("Linux booting...");
        };
    </script>
</body>
</html>
